let mode='user',view='home',order=null,pay={m:'JazzCash',num:'',step:0},rc=null,chat=null,q='',ci=0,ct;
const GR=['#4cb8ff,#0b1220','#0b1220,#1e90e6','#9fd6ff,#1e90e6','#1e90e6,#0b1220','#4cb8ff,#1b2a40'];
function theme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1900)}
function setMode(m){mode=m;render()}
function go(v){view=v;render();scrollTo(0,0)}
const pts=[12,9,8,7,6,5,4,3,2,1];

/* ---------- USER VIEWS ---------- */
const head=()=>`<div class="top g"><button class="logo" onclick="go('home')">H<b>O</b>F</button><button class="ib" aria-label="Daily rewards" onclick="go('rewards')">🎁</button><button class="ib" aria-label="Profile" onclick="go('profile')">👤</button><button class="ib" aria-label="Settings" onclick="go('settings')">⚙️</button></div>`;
const nav=()=>`<nav class="nav g">${[['lb','🏆','Leaderboard'],['mem','💎','Membership'],['chat','💬','Chat'],['pay','💳','Payment']].map(x=>`<button class="${view===x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}${x[0]==='chat'?ub():''}</button>`).join('')}</nav>`;
const V={
home(){return `<div class="hero"><h2>Hi ${esc(S.me.name.split(' ')[0])}, ready to drop?</h2><div style="font-size:13px;opacity:.9">Book tonight’s Free Fire scrims and climb the board.</div></div>
<h3>Tournament news</h3><div class="hs">${S.news.map(n=>`<div class="nc" style="${n.img?`background-image:url(${n.img})`:'background:linear-gradient(135deg,#4cb8ff,#0b1220)'}">${n.t?`<div><b>${esc(n.t)}</b><span>${esc(n.s||'')}</span></div>`:''}${regBtn(n)}</div>`).join('')}</div>
<h3>Book a scrim</h3>${S.scrims.map(s=>{const f=s.got>=s.cap;return `<div class="g card"><div class="row"><div class="sp"><b>${esc(s.t)} · ${esc(s.map)}</b><div class="m">${rs(s.fee)} per slot</div></div><span class="tag ${f?'f':''}">${f?'Full':s.got+'/'+s.cap+' booked'}</span></div><div class="bar"><i style="width:${Math.min(100,s.got/s.cap*100)}%"></i></div><button class="btn w" style="margin-top:10px" ${f?'disabled':''} onclick="buy('scrim',${s.id})">${f?'Slots full':'Book slot'}</button></div>`}).join('')}
<h3>Gear shop</h3><div class="car"><div id="car">${S.banners.map((b,i)=>`<div class="sl" style="background:linear-gradient(135deg,${GR[i%5]})"><b>${esc(b.t)}</b><span>${esc(b.s)}</span></div>`).join('')}</div></div><div class="dots">${S.banners.map((b,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`},
rewards(){return `<h2>Daily rewards</h2><div class="g card row"><div class="sp"><div class="m">Your balance</div><b style="font-size:26px">${S.coins} coins</b></div><span style="font-size:30px">🎁</span></div>${S.tasks.map(t=>`<div class="g card row"><div class="sp"><b style="font-size:14px">${esc(t.t)}</b><div class="m">Reward: ${esc(t.r)}</div></div><button class="btn ${t.d?'o':''}" ${t.d?'disabled':''} onclick="claim(${t.id})">${t.d?'Claimed':'Claim'}</button></div>`).join('')||'<p class="m">No tasks today. Check back tomorrow.</p>'}`},
profile(){const m=S.me,l=m.m-m.w;return `<div class="g card" style="text-align:center"><div class="av">${esc(m.name[0]||'?')}</div><input value="${esc(m.name)}" oninput="S.me.name=this.value;save()" aria-label="Name" style="text-align:center;font-weight:700"><div class="m" style="margin-bottom:8px">User ID: ${esc(m.id)}</div><input value="${esc(m.bio)}" oninput="S.me.bio=this.value;save()" aria-label="Bio" style="text-align:center"></div>
<h3>Your progress</h3><div class="grid"><div class="g st"><b>${m.m}</b><span class="m">Matches played</span></div><div class="g st"><b>${m.w}</b><span class="m">Matches won</span></div><div class="g st"><b>${l}</b><span class="m">Matches lost</span></div><div class="g st"><b>${m.k}</b><span class="m">Scrim kills</span></div></div>
<div class="g card row" style="margin-top:10px"><div class="sp"><b style="font-size:14px">Show progress to others</b><div class="m">${m.vis?'Visible: players can see your stats':'Hidden: only you can see your stats'}</div></div><button class="tg ${m.vis?'on':''}" role="switch" aria-checked="${m.vis}" aria-label="Progress visibility" onclick="S.me.vis=!S.me.vis;save();render()"></button></div>`},
settings(){return `<h2>Settings</h2><div class="g card"><b style="font-size:14px">Theme</b><div class="chips" style="margin:10px 0 0">${['light','dark','auto'].map(t=>`<button class="chip ${S.theme===t?'on':''}" onclick="S.theme='${t}';save();theme();render()">${t==='auto'?'System':t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
<h3>Payment history</h3>${S.hist.map(h=>`<div class="g card row"><div class="sp"><b style="font-size:14px">${esc(h.label)}</b><div class="m">${esc(h.date)} · ${esc(h.m)}</div></div><b>${rs(h.amt)}</b></div>`).join('')||'<p class="m">No payments yet.</p>'}
<button class="btn k w" style="margin-top:14px" onclick="go('login')">Log out</button>`},
login(){return `<div class="g card" style="text-align:center;margin-top:60px;padding:30px 18px"><div class="logo" style="font-size:26px;margin-bottom:6px">H<b>O</b>F</div><p class="m" style="margin-bottom:4px">House of Champions</p><p class="m" style="margin-bottom:18px">You’re logged out.</p><button class="btn w" onclick="go('home')">Log in again</button></div>`},
lb(){const a=[...S.lb].sort((x,y)=>y.p-x.p),c=(t,i)=>t?`<div class="g ${i==0?'p1':''}"><div class="rank r${i+1}" style="margin:0 auto 6px">${i+1}</div><b style="font-size:13px">${esc(t.n)}</b><div class="m">${t.p} pts</div></div>`:'<div></div>';
return `<h2>Leaderboard</h2><p class="m" style="margin:-6px 2px 14px">Updates automatically after every tournament.</p><div class="pod">${c(a[1],1)}${c(a[0],0)}${c(a[2],2)}</div>${a.slice(3).map((t,i)=>`<div class="g card row"><div class="rank">${i+4}</div><b class="sp" style="font-size:14px">${esc(t.n)}</b><span class="m">${t.p} pts</span></div>`).join('')}`},
mem(){return `<h2>Membership</h2>${S.member?`<div class="g card" style="background:linear-gradient(135deg,rgba(76,184,255,.5),rgba(11,18,32,.6));color:#fff"><b>Active plan: ${esc(S.member)}</b></div>`:''}${S.plans.map(p=>`<div class="g card"><div class="row"><b class="sp">${esc(p.n)}</b><b style="color:var(--ac2)">${rs(p.p)}</b></div><p class="m" style="margin:4px 0 10px">${esc(p.d)}</p><button class="btn w" onclick="buy('plan',${p.id})">Get ${esc(p.n)}</button></div>`).join('')||'<p class="m">No offers right now.</p>'}`},
chat(){if(chat){const m=S.msgs[chat.id]||[];return `<div class="row" style="margin-bottom:12px"><button class="ib" aria-label="Back" onclick="chat=null;render()">←</button><b>${esc(chat.n)}</b></div><div style="min-height:240px">${m.map(x=>`<div class="msg ${x.me?'me':'th'}">${esc(x.t)}</div>`).join('')||'<p class="m">Say hi to start the chat.</p>'}</div><div class="row"><input id="mi" placeholder="Message" style="margin:0" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Send</button></div>`}
return `<h2>Chat</h2><input placeholder="Search friends by ID or name" oninput="q=this.value;$('#res').innerHTML=ppl()" value="${esc(q)}"><div id="res">${ppl()}</div>`},
pay(){if(rc)return `<h2>Payment successful</h2><div class="g rc"><div class="row"><span class="sp m">Receipt no.</span><b>${rc.no}</b></div><div class="row"><span class="sp m">Item</span><b>${esc(rc.label)}</b></div><div class="row"><span class="sp m">Amount</span><b>${rs(rc.amt)}</b></div><div class="row"><span class="sp m">Paid via</span><b>${rc.m} ${rc.num}</b></div><div class="row" style="border:0"><span class="sp m">Date</span><b>${esc(rc.date)}</b></div></div><p class="m" style="margin:10px 2px">Take a screenshot of this receipt to save it.</p><button class="btn w" onclick="navigator.clipboard&&navigator.clipboard.writeText('Receipt '+rc.no+' | '+rc.label+' | '+rs(rc.amt)+' | '+rc.m+' | '+rc.date).then(()=>toast('Receipt copied'),()=>{});">Copy receipt text</button><button class="btn o w" style="margin-top:8px" onclick="rc=null;go('home')">Done</button>`;
if(!order)return `<h2>Payment</h2><div class="g card" style="text-align:center;padding:30px 16px"><div style="font-size:34px">💳</div><p class="m" style="margin-top:8px">Nothing to pay yet. Book a scrim or pick a membership and you’ll land here.</p></div>`;
return `<h2>Payment</h2><div class="g card row"><div class="sp"><b>${esc(order.label)}</b><div class="m">Total to pay</div></div><b style="font-size:20px">${rs(order.amt)}</b></div><b style="font-size:14px;margin:0 2px">Pay with</b><div class="chips" style="margin-top:8px">${['JazzCash','Easypaisa','Telenor'].map(x=>`<button class="chip ${pay.m===x?'on':''}" onclick="pay.m='${x}';render()">${x}</button>`).join('')}</div>
${pay.step?`<div class="g card"><div class="row"><span class="sp m">Method</span><b>${pay.m}</b></div><div class="row"><span class="sp m">Account</span><b>${esc(pay.num)}</b></div><div class="row"><span class="sp m">Amount</span><b>${rs(order.amt)}</b></div></div><button class="btn w" onclick="doPay()">Pay ${rs(order.amt)}</button><button class="btn o w" style="margin-top:8px" onclick="pay.step=0;render()">Edit details</button>`:`<input id="pn" inputmode="numeric" maxlength="11" placeholder="Mobile number (03XXXXXXXXX)" value="${esc(pay.num)}"><button class="btn w" onclick="confirmP()">Confirm details</button>`}`}};
const ppl=()=>{const r=S.people.filter(p=>(p.id+p.n).toLowerCase().includes(q.toLowerCase()));return r.map(p=>`<div class="g card row" onclick="chat=S.people.find(x=>x.id==='${p.id}');render()" style="cursor:pointer"><div class="av" style="width:42px;height:42px;font-size:17px;border-radius:15px;margin:0">${esc(p.n[0])}</div><div class="sp"><b style="font-size:14px">${esc(p.n)}</b><div class="m">${p.id}</div></div></div>`).join('')||'<p class="m">No player found with that ID.</p>'};

/* ---------- USER ACTIONS ---------- */
function buy(k,id){if(k==='scrim'){const s=S.scrims.find(x=>x.id===id);order={kind:k,id,amt:s.fee,label:'Scrim slot, '+s.t+' '+s.map}}else{const p=S.plans.find(x=>x.id===id);order={kind:k,id,amt:p.p,label:p.n+' membership'}}pay.step=0;go('pay')}
function claim(id){const t=S.tasks.find(x=>x.id===id);t.d=1;S.coins+=parseInt(t.r)||0;save();toast('Reward added');render()}
function send(){const i=$('#mi');if(!i.value.trim())return;(S.msgs[chat.id]=S.msgs[chat.id]||[]).push({me:1,t:i.value.trim()});save();render();$('#mi').focus()}
function confirmP(){const n=$('#pn').value.trim();if(!/^03\d{9}$/.test(n)){toast('Enter an 11-digit number starting with 03');return}pay.num=n;pay.step=1;render()}
function doPay(){const d=new Date().toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});rc={no:'SZ'+Math.floor(100000+Math.random()*899999),label:order.label,amt:order.amt,m:pay.m,num:pay.num.slice(0,4)+'****'+pay.num.slice(-3),date:d};
if(order.kind==='scrim')S.scrims.find(x=>x.id===order.id).got++;else S.member=S.plans.find(x=>x.id===order.id).n;
S.hist.unshift({label:rc.label,amt:rc.amt,m:rc.m,date:d});save();order=null;pay.step=0;render()}
function startCar(){clearInterval(ct);ci=0;ct=setInterval(()=>{const t=$('#car');if(!t){clearInterval(ct);return}ci=(ci+1)%S.banners.length;t.style.transform=`translateX(-${ci*100}%)`;document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===ci))},3000)}

/* ---------- ADMIN ---------- */
const AD={scrims:['Scrim slots',['t:Time (8:00 PM)','map:Map','fee:Fee (Rs)','cap:Total slots'],x=>`${x.t} · ${x.map} · ${rs(x.fee)} · ${x.got}/${x.cap}`],
tasks:['Daily reward tasks',['t:Task','r:Reward (e.g. 20 coins)'],x=>`${x.t} → ${x.r}`],
plans:['Membership offers',['n:Plan name','p:Price (Rs)','d:Benefits'],x=>`${x.n} · ${rs(x.p)}`],
banners:['Gear shop banners (max 5)',['t:Title (optional)','s:Subtitle (optional)'],x=>(x.img?'🖼 ':'')+(x.t||'Image only')],
news:['Tournament news',['t:Headline (optional)','s:Details (optional)'],x=>(x.img?'🖼 ':'')+(x.t||'Image only')]};
function admin(){const rev=S.hist.reduce((a,h)=>a+h.amt,0),bk=S.scrims.reduce((a,s)=>a+s.got,0);
return `<div class="hd mini"><div class="logo">Admin <b>panel</b></div></div>
${role==='super'?`<div class="grid"><div class="g st"><b>${rs(rev)}</b><span class="m">Revenue</span></div><div class="g st"><b>${bk}</b><span class="m">Slots booked</span></div></div>`:''}
${Object.entries(AD).map(([k,[title,f,fmt]])=>`<h3>${title}</h3><div class="g card">${k==='news'||k==='banners'?'<p class="m" style="margin-bottom:8px">Upload your designed image (16:9 works best). Text fields are optional.</p>':''}${f.map((x,i)=>`<input id="f-${k}-${i}" placeholder="${x.split(':')[1]}" aria-label="${x.split(':')[1]}">`).join('')}${xf(k)}<button class="btn w" onclick="${k==='news'||k==='banners'?`addN2('${k}')`:`addI('${k}')`}">Upload</button></div>${S[k].map(x=>`<div class="g card row"><span class="sp" style="font-size:13px">${esc(fmt(x))}</span><button class="x" aria-label="Delete" onclick="delI('${k}',${x.id})">✕</button></div>`).join('')}`).join('')}
<h3>Tournament result</h3><div class="g card"><p class="m" style="margin-bottom:8px">Points = placement points + kills. The leaderboard re-ranks instantly.</p><input id="rt" placeholder="Team name"><input id="rp" inputmode="numeric" placeholder="Placement (1 to 12)"><input id="rk" inputmode="numeric" placeholder="Total kills"><button class="btn w" onclick="addR()">Update leaderboard</button></div>${adm2()}`}
function addI(k){const o={id:Date.now()};let ok=1;AD[k][1].forEach((x,i)=>{const [key]=x.split(':'),v=$(`#f-${k}-${i}`).value.trim();if(!v)ok=0;o[key]=['fee','cap','p'].includes(key)?Number(v)||0:v});if(!ok){toast('Fill every field');return}if(k==='scrims')o.got=0;if(k==='tasks')o.d=0;S[k].unshift(o);save();toast('Uploaded');render()}
function addN(){const f=$('#f-news-img').files[0];if(!f){toast('Choose a thumbnail image');return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(800,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.news.unshift({id:Date.now(),t:$('#f-news-0').value.trim(),s:$('#f-news-1').value.trim(),img:c.toDataURL('image/jpeg',.8)});save();toast('News uploaded');render()};im.onerror=()=>toast('Could not read this image');im.src=r.result};r.readAsDataURL(f)}
function delI(k,id){S[k]=S[k].filter(x=>x.id!==id);save();render()}
function addR(){const n=$('#rt').value.trim(),p=parseInt($('#rp').value),k=parseInt($('#rk').value)||0;if(!n||!p){toast('Enter team and placement');return}const add=(pts[p-1]||0)+k;let t=S.lb.find(x=>x.n.toLowerCase()===n.toLowerCase());t?t.p+=add:S.lb.push({n,p:add});save();toast(n+' +'+add+' pts');render()}

function render(){document.querySelectorAll('.sw button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));const a=$('#app');
if(mode==='admin'){a.innerHTML=admin();return}
a.innerHTML=(view==='login'?'':head())+'<main>'+(V[view]||V.home)()+'</main>'+(view==='login'?'':nav());if(view==='home')startCar()}
const AVC=['#4cb8ff,#0b1220','#1e90e6,#9fd6ff','#0b1220,#4cb8ff'];
const av=(p,s)=>`<div class="ca" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.4)}px;background:linear-gradient(135deg,${AVC[p.n.length%3]})">${esc(p.n[0])}</div>`;
const last=p=>{const m=S.msgs[p.id]||[];return m[m.length-1]};
const openC=id=>{chat=S.people.find(x=>x.id===id);render()};
const list2=()=>{const r=S.people.filter(p=>(p.id+p.n).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>((last(b)||{}).i||0)-((last(a)||{}).i||0));return r.map(p=>{const l=last(p);return `<div class="cr" onclick="openC('${p.id}')">${av(p,56)}<div class="sp"><b>${esc(p.n)}</b><div class="m cp">${l?(l.me?'You: ':'')+esc(l.t)+' · '+l.h:esc(p.id)}</div></div></div>`}).join('')||'<p class="m" style="padding:14px 4px">No player found with that ID.</p>'};
V.chat=function(){if(chat){const m=S.msgs[chat.id]||[];return `<div class="ch"><button class="ib" aria-label="Back" onclick="chat=null;render()">←</button>${av(chat,40)}<div class="sp"><b style="font-size:15px">${esc(chat.n)}</b><div class="m" style="font-size:12px">${chat.id} · Active now</div></div></div><div class="cm">${m.length?m.map(x=>`<div class="bb ${x.me?'sb':'rb'} ${x.t==='❤️'?'hrt':''}">${esc(x.t)}</div>`).join(''):`<div style="text-align:center;padding:36px 0"><div style="display:flex;justify-content:center">${av(chat,84)}</div><b style="display:block;margin-top:10px">${esc(chat.n)}</b><div class="m">${chat.id}</div><div class="m" style="margin-top:8px">Say hi to start the chat</div></div>`}</div><div class="ci"><input id="mi" placeholder="Message…" aria-label="Message" oninput="$('#sb').textContent=this.value.trim()?'Send':'❤️'" onkeydown="if(event.key==='Enter')send()"><button id="sb" aria-label="Send" onclick="send()">❤️</button></div>`}
return `<div class="row" style="margin-bottom:12px"><h2 class="sp" style="margin:0">${esc(S.me.name.toLowerCase().replace(/\s+/g,'_'))}</h2><span style="font-size:20px">✏️</span></div><input class="cs" placeholder="Search by ID or name" aria-label="Search players" oninput="q=this.value;$('#res').innerHTML=list2()" value="${esc(q)}"><div class="hs" style="margin:6px 0 10px">${S.people.map(p=>`<div class="sr" onclick="openC('${p.id}')"><div class="rg">${av(p,60)}</div>${esc(p.n.split(' ')[0])}</div>`).join('')}</div><b style="font-size:14px">Messages</b><div id="res">${list2()}</div>`};
function send(){const i=$('#mi'),t=i.value.trim()||'❤️';(S.msgs[chat.id]=S.msgs[chat.id]||[]).push({me:1,t,h:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}),i:Date.now()});save();render();$('#mi').focus();scrollTo(0,document.body.scrollHeight)}
const ibs=()=>`<button class="hb" aria-label="Daily rewards" onclick="go('rewards')">🎁${S.tasks.some(t=>!t.d)?'<i class="dot"></i>':''}</button><button class="hb" aria-label="Notifications" onclick="go('notifs')">🔔${nc()}</button><button class="hb" aria-label="Profile" onclick="go('profile')">👤</button><button class="hb" aria-label="Settings" onclick="go('settings')">⚙️</button>`;
const head2=()=>`<div class="hd mini"><div class="row"><button class="logo" onclick="go('home')">H<b>O</b>F</button>${ibs()}</div></div>`;
const nav2=()=>`<nav class="nav g">${[['home','🏠','Home'],['lb','🏆','Ranks'],['mem','💎','Member'],['chat','💬','Chat'],['pay','💳','Pay']].map(x=>`<button class="${view===x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}${x[0]==='chat'?ub():''}</button>`).join('')}</nav>`;
const dotsH=(n,c)=>`<div class="dots ${c||''}">${Array.from({length:n},(_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`;
function jump(id){const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
function dts(e){const i=Math.round(e.scrollLeft/(e.firstElementChild.offsetWidth+12));[...e.nextElementSibling.children].forEach((d,j)=>d.classList.toggle('on',j===i))}

async function loadAll(){
 const since=new Date(Date.now()-864e5).toISOString();
 const q=await Promise.all([
  sb.from('profiles').select('*').eq('id',uid).single(),
  sb.from('scrims').select('*').eq('active',true).order('id'),
  sb.from('scrim_slots').select('*'),
  sb.from('plans').select('*').order('id'),
  sb.from('news').select('*').order('id',{ascending:false}),
  sb.from('banners').select('*').order('id',{ascending:false}).limit(5),
  sb.from('lb').select('*').order('points',{ascending:false}),
  sb.from('payments').select('*').eq('user_id',uid).order('id',{ascending:false}).limit(30),
  sb.from('bookings').select('*,scrims(time_label,map)').eq('user_id',uid).order('id',{ascending:false}),
  sb.rpc('my_peers'),
  sb.from('messages').select('*').or('sender.eq.'+uid+',receiver.eq.'+uid).order('created_at').limit(500),
  sb.from('groups').select('*'),
  sb.from('group_messages').select('*').order('created_at').limit(500),
  sb.from('stories').select('*').gt('created_at',since).order('created_at'),
  sb.from('notifications').select('*').order('id',{ascending:false}).limit(30),
  sb.from('registrations').select('news_id').eq('user_id',uid),
  sb.rpc('ads_today'),
  sb.from('scrim_rooms').select('*')]);
 const [P,SC,SL,PL,NW,BN,LB,PY,BK,PE,MS,GR,GM,ST,NT,RG,AC,RM]=q;
 if(P.error||!P.data){toast('Could not load your profile');return false}
 const p=P.data,tk=SL.data||[];
 role=p.role==='user'?null:p.role;vSync=p.visible;
 S.me={uid,name:p.name,id:p.player_id,bio:p.bio,m:p.matches,w:p.wins,k:p.kills,vis:p.visible,av:p.avatar_url,ffu:p.ff_uid,ffn:p.ff_name};
 S.coins=p.coins;S.member=p.member;S.ads=AC.data||0;
 S.scrims=(SC.data||[]).map(s=>({id:s.id,t:s.time_label,map:s.map,fee:s.fee,cap:s.cap,got:((tk.find(x=>x.scrim_id===s.id)||{}).taken)||0}));
 S.plans=(PL.data||[]).map(x=>({id:x.id,n:x.name,p:x.price,d:x.description}));
 S.tasks=[];
 const im=x=>({id:x.id,t:x.title,s:x.subtitle,img:x.image_url});
 S.news=(NW.data||[]).map(x=>({...im(x),reg:x.reg}));
 S.banners=(BN.data||[]).map(x=>({...im(x),d:x.details,pr:x.price_text,url:x.buy_url}));
 S.lb=(LB.data||[]).map(x=>({n:x.team,p:x.points,img:x.image_url}));
 S.mine=(BK.data||[]).map(b=>({sid:b.scrim_id,label:b.scrims?b.scrims.time_label+' \u00b7 '+b.scrims.map:'Scrim',date:dt(b.created_at)}));
 S.hist=(PY.data||[]).map(y=>{const pl=S.plans.find(x=>x.id===y.ref_id),sc=S.scrims.find(x=>x.id===y.ref_id);const l=y.kind==='plan'?(pl?pl.n+' membership':'Membership'):(sc?'Scrim '+sc.t+' '+sc.map:'Scrim slot');return{l0:l,label:l+' ('+y.status+')',st:y.status,amt:y.amount,m:y.method,date:dt(y.created_at)}});
 S.people=(PE.data||[]).map(x=>({id:x.player_id,uid:x.id,n:x.name,av:x.avatar_url,bio:x.bio,st:x.matches==null?null:[x.matches,x.wins,x.kills]}));
 S.groups=(GR.data||[]).map(g=>({g:1,id:g.id,n:g.name}));
 S.msgs={};(MS.data||[]).forEach(m=>{const o=m.sender===uid?m.receiver:m.sender,pe=S.people.find(x=>x.uid===o);if(!pe)return;(S.msgs[pe.id]=S.msgs[pe.id]||[]).push({me:m.sender===uid?1:0,t:m.body,h:tm(m.created_at),i:+new Date(m.created_at)})});
 S.gmsgs={};(GM.data||[]).forEach(m=>{(S.gmsgs[m.group_id]=S.gmsgs[m.group_id]||[]).push({me:m.sender===uid?1:0,t:m.body,h:tm(m.created_at),i:+new Date(m.created_at),from:nameOf(m.sender)})});
 S.stories=ST.data||[];S.notifs=NT.data||[];S.regs=(RG.data||[]).map(r=>r.news_id);
 S.rooms={};(RM.data||[]).forEach(r=>S.rooms[r.scrim_id]=r);
 if(role){
  const a=await Promise.all([
   sb.from('payments').select('*,profiles(name,player_id)').order('id',{ascending:false}).limit(100),
   sb.from('bookings').select('*,profiles(name,player_id,ff_uid,ff_name)').order('id'),
   sb.from('registrations').select('*,news(title),profiles(name,player_id)').order('id')]);
  S.allpay=a[0].data||[];S.allbk=a[1].data||[];S.allreg=a[2].data||[]}
 return true}

/* realtime + alerts */
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.05;o.start();setTimeout(()=>{o.stop();c.close()},120)}catch(e){}}
function alertMsg(t,b){toast('\ud83d\udd14 '+t+': '+String(b).slice(0,40));try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}beep();if(document.hidden&&window.Notification&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:String(b).slice(0,80),icon:'icon-192.png',tag:'hof'})).catch(()=>{})}
function askNotif(){if(window.Notification)Notification.requestPermission().then(()=>render());else toast('Alerts are not supported on this browser')}
function incoming(pe,body,at,from,push){const k=keyOf(pe);if(push!==false)(pe.g?(S.gmsgs[pe.id]=S.gmsgs[pe.id]||[]):(S.msgs[pe.id]=S.msgs[pe.id]||[])).push({me:0,t:body,h:tm(at),i:Date.now(),from});const open=view==='chat'&&chat&&keyOf(chat)===k&&!document.hidden;if(open)setRd(k);else alertMsg(pe.g?pe.n+' \u00b7 '+from:pe.n,body);render()}
async function onDM(e){const m=e.new;let pe=S.people.find(x=>x.uid===m.sender);if(pe)return incoming(pe,m.body,m.created_at);await loadAll();pe=S.people.find(x=>x.uid===m.sender);if(pe)incoming(pe,m.body,m.created_at,null,false);else{alertMsg('New message',m.body);render()}}
async function onGM(e){const m=e.new;if(m.sender===uid)return;let g=S.groups.find(x=>x.id===m.group_id);if(!g){await loadAll();g=S.groups.find(x=>x.id===m.group_id);if(g)incoming(g,m.body,m.created_at,nameOf(m.sender),false);return}incoming(g,m.body,m.created_at,nameOf(m.sender))}
async function onNT(e){await loadAll();alertMsg(e.new.title,e.new.body);render()}
async function boot2(){
 const r=await sb.auth.getSession(),s=r.data&&r.data.session;
 ready=true;
 if(!s){uid=null;render();return}
 uid=s.user.id;await loadAll();
 if(!chan){chan=sb.channel('hof-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'receiver=eq.'+uid},onDM).on('postgres_changes',{event:'INSERT',schema:'public',table:'group_messages'},onGM).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+uid},onNT).subscribe()}
 render()}

/* chat: find by ID, groups, stories */
function openK(k){chat=S.groups.find(x=>'g'+x.id===k)||S.people.find(x=>x.id===k);if(chat)setRd(keyOf(chat));render()}
const foundHtml=()=>found?`<div class="g card row">${avt(found,48)}<div class="sp"><b style="font-size:14px">${esc(found.n)}</b><div class="m">${esc(found.id)}${found.bio?' \u00b7 '+esc(found.bio):''}</div></div><button class="btn o" onclick="addFound()">+ Group</button><button class="btn" onclick="msgFound()">Message</button></div>`:'';
async function findP(){const v=$('#fq').value.trim();if(!v)return;const r=await sb.rpc('find_player',{pid:v});if(r.error||!r.data||!r.data.length){found=null;toast('No player with that ID');$('#fr').innerHTML='';return}const x=r.data[0];if(x.id===uid){toast('That is your own ID');return}found={uid:x.id,id:x.player_id,n:x.name,av:x.avatar_url,bio:x.bio,st:x.matches==null?null:[x.matches,x.wins,x.kills]};$('#fr').innerHTML=foundHtml()}
function msgFound(){if(!S.people.find(p=>p.uid===found.uid))S.people.push(found);chat=S.people.find(p=>p.uid===found.uid);found=null;render()}
function addFound(){if(!S.people.find(p=>p.uid===found.uid))S.people.push(found);if(!gsel.includes(found.uid))gsel.push(found.uid);found=null;toast('Added to new group');newGroup()}
function newGroup(){view='group';render()}
function togG(u){gsel=gsel.includes(u)?gsel.filter(x=>x!==u):[...gsel,u];render()}
async function mkGroup(){if(!gname.trim()){toast('Enter a group name');return}const r=await sb.rpc('create_group',{gname:gname.trim(),members:gsel});if(r.error){toast(r.error.message);return}gsel=[];gname='';await loadAll();chat=S.groups.find(x=>x.id===r.data);view='chat';render()}
V.group=()=>`<div class="row" style="margin-bottom:12px"><button class="ib" aria-label="Back" onclick="gsel=[];gname='';go('chat')">\u2190</button><h2 style="margin:0">New group</h2></div><input placeholder="Group name (e.g. Team Alpha)" aria-label="Group name" maxlength="40" value="${esc(gname)}" oninput="gname=this.value"><b style="font-size:14px">Add members</b><p class="m" style="margin:2px 0 8px">Pick from your chats, or find a player by ID in Chats and tap + Group.</p>${S.people.map(p=>`<div class="cr" onclick="togG('${p.uid}')">${avt(p,44)}<div class="sp"><b>${esc(p.n)}</b><div class="m">${esc(p.id)}</div></div><span class="tag" style="opacity:${gsel.includes(p.uid)?1:.4}">${gsel.includes(p.uid)?'Added':'Add'}</span></div>`).join('')||'<p class="m">No contacts yet.</p>'}<button class="btn w" style="margin-top:12px" onclick="mkGroup()">Create group (${gsel.length+1} members)</button>`;
const storyRow=()=>{const mine=S.stories.some(s=>s.user_id===uid),us=[...new Set(S.stories.filter(s=>s.user_id!==uid).map(s=>s.user_id))];return `<div class="hs" style="margin:0 0 12px"><div class="sr" onclick="${mine?'openStory(uid)':'composeStory()'}"><div class="rg" style="${mine?'':'background:var(--in)'}">${avt({n:S.me.name,av:S.me.av},60)}</div>${mine?'Your story':'+ Story'}</div>${us.map(u=>{const p=S.people.find(x=>x.uid===u)||{n:'Player'};return `<div class="sr" onclick="openStory('${u}')"><div class="rg">${avt(p,60)}</div>${esc(p.n.split(' ')[0])}</div>`}).join('')}</div>${mine?'<button class="btn o w" style="margin-bottom:10px" onclick="composeStory()">+ Add to your story</button>':''}`};
function composeStory(){view='story';render()}
V.story=()=>`<div class="row" style="margin-bottom:12px"><button class="ib" aria-label="Back" onclick="go('chat')">\u2190</button><h2 style="margin:0">New story</h2></div><div class="stp" style="background:${sdraft.bg}"><div id="stx">${esc(sdraft.t)||'Type something\u2026'}</div></div><textarea maxlength="280" placeholder="Need a rusher? Sniper wanted? Your mood\u2026 emojis welcome" aria-label="Story text" oninput="sdraft.t=this.value;$('#stx').textContent=this.value||'Type something\u2026'">${esc(sdraft.t)}</textarea><div class="chips" style="margin:8px 0">${BGS.map(c=>`<button class="chip ${sdraft.bg===c?'on':''}" style="background:${c};height:34px;flex:none;width:34px;padding:0" aria-label="Colour" onclick="sdraft.bg='${c}';render()"></button>`).join('')}</div><div class="hs" style="margin-bottom:10px">${['Need a rusher \ud83d\udd25','Sniper wanted \ud83c\udfaf','Challenge: 1v1 tonight \u2694\ufe0f','Mood: \ud83d\ude0e','Squad up! \ud83d\udc65'].map(x=>`<button class="pc p1" onclick="sdraft.t='${x}';render()">${x}</button>`).join('')}</div><button class="btn w" onclick="postStory()">Post story (24 hours)</button>`;
async function postStory(){const t=sdraft.t.trim();if(!t){toast('Write something first');return}const r=await sb.from('stories').insert({user_id:uid,body:t,bg:sdraft.bg});if(r.error){toast(r.error.message);return}sdraft.t='';toast('Story posted');await loadAll();go('chat')}
function openStory(u){const l=S.stories.filter(s=>s.user_id===u);if(!l.length)return;let i=0;const p=u===uid?{n:'Your story'}:(S.people.find(x=>x.uid===u)||{n:'Player'}),o=document.createElement('div');o.className='sview';const show=()=>{const s=l[i];o.style.background=s.bg;o.innerHTML='<div class="svb">'+l.map((_,j)=>'<i class="'+(j<=i?'on':'')+'"></i>').join('')+'</div><div class="svn">'+esc(p.n)+' \u00b7 '+tm(s.created_at)+'</div><div class="svt">'+esc(s.body)+'</div>'};o.onclick=()=>{i++;if(i>=l.length)o.remove();else show()};show();document.body.appendChild(o)}
function thread(){const m=msgsOf(chat);return `<div class="ch"><button class="ib" aria-label="Back" onclick="chat=null;render()">\u2190</button>${chat.g?gAv(40):avt(chat,40)}<div class="sp"><b style="font-size:15px">${esc(chat.n)}</b><div class="m" style="font-size:12px">${chat.g?'Group chat':esc(chat.id)+(chat.st?' \u00b7 '+chat.st[2]+' kills':'')}</div></div></div><div class="cm">${m.map(x=>`${chat.g&&!x.me&&x.from?`<div class="m" style="font-size:11px;margin:4px 8px 0">${esc(x.from)}</div>`:''}<div class="bb ${x.me?'sb':'rb'} ${x.t==='\u2764\ufe0f'?'hrt':''}">${esc(x.t)}</div>`).join('')||'<p class="m" style="text-align:center;padding:30px 0">Say hi to start the chat</p>'}</div><div class="ci"><input id="mi" placeholder="Message\u2026" aria-label="Message" oninput="$('#sb').textContent=this.value.trim()?'Send':'\u2764\ufe0f'" onkeydown="if(event.key==='Enter')send()"><button id="sb" aria-label="Send" onclick="send()">\u2764\ufe0f</button></div>`}
V.chat=function(){if(chat)return thread();const it=[...S.people,...S.groups].map(p=>({p,l:msgsOf(p).slice(-1)[0]})).sort((a,b)=>((b.l||{}).i||0)-((a.l||{}).i||0));
return `<div class="row" style="margin-bottom:10px"><h2 class="sp" style="margin:0">Chats</h2><button class="btn o" onclick="newGroup()">\ud83d\udc65 New group</button></div>${storyRow()}<div class="row" style="margin:6px 0 10px"><input class="cs" id="fq" placeholder="Find a player by exact ID (FF-123456)" aria-label="Find player" style="margin:0" onkeydown="if(event.key==='Enter')findP()"><button class="btn" onclick="findP()">Find</button></div><div id="fr">${foundHtml()}</div><b style="font-size:14px">Messages</b>${it.map(({p,l})=>`<div class="cr" onclick="openK('${keyOf(p)}')">${p.g?gAv(56):avt(p,56)}<div class="sp"><b>${esc(p.n)}</b><div class="m cp">${l?(l.me?'You: ':(p.g&&l.from?esc(l.from)+': ':''))+esc(l.t):(p.g?'Group':esc(p.id))}</div></div>${unread(p)?`<span class="bd2">${unread(p)}</span>`:''}</div>`).join('')||'<p class="m" style="padding:14px 4px">No chats yet. Find a friend by their ID to start.</p>'}`};
send=async function(){const i=$('#mi'),t=i.value.trim()||'\u2764\ufe0f';let r;if(chat.g)r=await sb.from('group_messages').insert({group_id:chat.id,sender:uid,body:t});else r=await sb.from('messages').insert({sender:uid,receiver:chat.uid,body:t});if(r.error){toast('Message failed');return}(chat.g?(S.gmsgs[chat.id]=S.gmsgs[chat.id]||[]):(S.msgs[chat.id]=S.msgs[chat.id]||[])).push({me:1,t,h:tm(Date.now()),i:Date.now()});setRd(keyOf(chat));render();$('#mi').focus();scrollTo(0,document.body.scrollHeight)};
V.notifs=function(){nseen=Math.max(nseen,...S.notifs.map(n=>n.id),0);try{localStorage.setItem('hof_nseen',nseen)}catch(e){}return `<h2>Notifications</h2>${window.Notification&&Notification.permission!=='granted'?'<button class="btn w" style="margin-bottom:10px" onclick="askNotif()">Enable message alerts</button>':''}${S.notifs.map(n=>`<div class="g card"><b style="font-size:14px">${esc(n.title)}</b><div class="m">${esc(n.body)} \u00b7 ${dt(n.created_at)}</div></div>`).join('')||'<p class="m">Nothing yet.</p>'}`};

/* ads rewards */
V.rewards=()=>`<h2>Daily rewards</h2><div class="g card row"><div class="sp"><div class="m">Your tokens</div><b style="font-size:26px">${S.coins}</b></div><span style="font-size:30px">\ud83c\udf81</span></div><div class="g card"><b>Watch ads, earn tokens</b><p class="m" style="margin:4px 0 10px">5 ads per day, +5 tokens each. Resets at midnight, Pakistan time.</p><div class="bar"><i style="width:${S.ads/5*100}%"></i></div><div class="m" style="margin:6px 0 12px">${S.ads}/5 watched today</div><button class="btn w" ${S.ads>=5?'disabled':''} onclick="playAd()">${S.ads>=5?'Come back tomorrow':'Watch ad (+5 tokens)'}</button></div>`;
function playAd(){const o=document.createElement('div');o.className='sview';o.style.background='#05080d';let n=15;const t=()=>{o.innerHTML='<div class="svn">Sponsored \u00b7 demo ad</div><div class="svt">\ud83c\udfae<br>Your ad plays here<br><small style="font-size:14px;opacity:.7">Reward in '+n+'s</small></div>'};t();document.body.appendChild(o);const iv=setInterval(async()=>{n--;if(n>0){t();return}clearInterval(iv);o.remove();const r=await sb.rpc('watch_ad');if(r.error){toast(r.error.message);return}toast('+5 tokens earned');await loadAll();render()},1000)}

/* leaderboard hero, profile */
const _lb=V.lb;
V.lb=()=>{const t=[...S.lb].sort((x,y)=>y.p-x.p)[0];return (t?`<div class="hero1" style="${t.img?`background:linear-gradient(transparent 35%,rgba(0,0,0,.75)),url(${esc(t.img)}) center/cover`:'background:linear-gradient(135deg,#4cb8ff,#0b1220)'}"><span class="tag" style="background:#fff;color:#0b1220;align-self:flex-start">\ud83d\udc51 1st place</span><b style="font-size:20px">${esc(t.n)}</b><span>${t.p} pts</span></div>`:'')+_lb()};
V.profile=function(){const m=S.me,l=m.m-m.w;return `<div class="g card" style="text-align:center"><div style="position:relative;width:96px;margin:0 auto 10px">${avt({n:m.name,av:m.av},96)}<label class="cam" aria-label="Change photo">\ud83d\udcf7<input type="file" accept="image/*" style="display:none" onchange="setDP(this)"></label></div><input value="${esc(m.name)}" aria-label="Name" maxlength="30" style="text-align:center;font-weight:700"><div class="m" style="margin-bottom:8px">User ID: ${esc(m.id)}</div><input value="${esc(m.bio||'')}" aria-label="Bio" maxlength="120" placeholder="Write your bio" style="text-align:center;margin:0"></div><h3>Free Fire details</h3><div class="g card"><input value="${esc(m.ffu||'')}" aria-label="FF UID" inputmode="numeric" placeholder="Free Fire UID"><input value="${esc(m.ffn||'')}" aria-label="FF name" placeholder="In-game name" style="margin:0"><p class="m" style="margin-top:8px">Used for scrim lists. Only admins can see it.</p></div><h3>Your progress</h3><div class="grid"><div class="g st"><b>${m.m}</b><span class="m">Matches played</span></div><div class="g st"><b>${m.w}</b><span class="m">Matches won</span></div><div class="g st"><b>${l}</b><span class="m">Matches lost</span></div><div class="g st"><b>${m.k}</b><span class="m">Scrim kills</span></div></div><div class="g card row" style="margin-top:10px"><div class="sp"><b style="font-size:14px">Private profile</b><div class="m">${m.vis?'Public: others can see your bio and stats':'Private: bio and stats are hidden'}</div></div><button class="tg ${m.vis?'':'on'}" role="switch" aria-checked="${!m.vis}" aria-label="Private profile" onclick="S.me.vis=!S.me.vis;render()"></button></div>`};
document.addEventListener('input',e=>{const l=e.target.getAttribute&&e.target.getAttribute('aria-label'),k={Name:'name',Bio:'bio','FF UID':'ffu','FF name':'ffn'}[l];if(!uid||!k)return;S.me[k]=e.target.value;clearTimeout(pt);pt=setTimeout(()=>sb.from('profiles').update({name:S.me.name,bio:S.me.bio,ff_uid:S.me.ffu||null,ff_name:S.me.ffn||null}).eq('id',uid),700)});
async function setDP(inp){const f=inp.files[0];if(!f)return;try{const b=await shrink(f,400),p='avatars/'+uid+'_'+Date.now()+'.jpg',u=await sb.storage.from('media').upload(p,b,{contentType:'image/jpeg'});if(u.error)throw u.error;const url=sb.storage.from('media').getPublicUrl(p).data.publicUrl,r=await sb.from('profiles').update({avatar_url:url}).eq('id',uid);if(r.error)throw r.error;S.me.av=url;toast('Photo updated');render()}catch(e){toast(e.message||'Upload failed')}}

/* news register, gear shop, room details */
const regBtn=n=>n.reg?(S.regs.includes(n.id)?'<span class="rg2 done">Registered \u2713</span>':`<button class="rg2" onclick="openReg(${n.id})">Register</button>`):'';
function sheet(h){const o=document.createElement('div');o.className='sheet';o.innerHTML='<div class="g card" style="padding:0;overflow:hidden">'+h+'</div>';document.body.appendChild(o);return o}
function openReg(id){const n=S.news.find(x=>x.id===id);if(!n)return;const o=sheet(`<div style="padding:18px"><b style="font-size:16px">Register: ${esc(n.t||'Tournament')}</b><p class="m" style="margin:4px 0 12px">Enter your team details.</p><input id="rtn" placeholder="Team name" aria-label="Team name" maxlength="40"><input id="ruid" inputmode="numeric" placeholder="Your Free Fire UID" aria-label="Free Fire UID" value="${esc(S.me.ffu||'')}"><div class="row"><button class="btn o sp" id="rcx">Cancel</button><button class="btn sp" id="rok">Register</button></div></div>`);o.querySelector('#rcx').onclick=()=>o.remove();o.querySelector('#rok').onclick=async()=>{const t=$('#rtn').value.trim(),f=$('#ruid').value.trim();if(!t||!f){toast('Fill team name and UID');return}const r=await sb.from('registrations').insert({news_id:id,user_id:uid,team_name:t,ff_uid:f});if(r.error){toast(/duplicate/.test(r.error.message)?'Already registered':r.error.message);return}o.remove();toast('Registered!');await loadAll();render()}}
function openProd(i){const b=S.banners[i];if(!b)return;const ok=/^https?:\/\//.test(b.url||'');const o=sheet(`${b.img?`<div style="height:170px;background:url(${esc(b.img)}) center/cover"></div>`:''}<div style="padding:16px"><b style="font-size:17px">${esc(b.t||'Gear')}</b><div class="m" style="margin:4px 0 8px">${esc(b.s||'')}</div><p style="font-size:14px;margin-bottom:8px">${esc(b.d||'')}</p>${b.pr?`<b style="font-size:20px;color:var(--ac2)">${esc(b.pr)}</b>`:''}<p class="m" style="margin:8px 0 12px">You will buy from our partner store. HOF may earn a small commission.</p><div class="row"><button class="btn o sp" id="pcx">Close</button><button class="btn sp" id="pby" ${ok?'':'disabled'}>${ok?'Buy now':'Coming soon'}</button></div></div>`);o.querySelector('#pcx').onclick=()=>o.remove();o.querySelector('#pby').onclick=()=>{window.open(b.url,'_blank','noopener');o.remove()}}
const roomBox=b=>{const r=S.rooms[b.sid];return r&&r.released?`<div class="rmb"><div><span class="m">Room ID</span><b>${esc(r.room_id)}</b></div><div><span class="m">Password</span><b>${esc(r.room_pass)}</b></div></div>`:'<div class="m" style="margin-top:8px">Room ID and password will appear here before the match.</div>'};

/* admin */
const xf=k=>k==='news'||k==='banners'?`<input type="file" id="f-${k}-img" accept="image/*" aria-label="Image">${k==='news'?'<label class="m" style="display:flex;gap:8px;align-items:center;margin:0 2px 8px"><input type="checkbox" id="f-news-reg" style="width:auto;margin:0"> Show Register button</label>':''}`:'';
addN2=async function(k){const f=$('#f-'+k+'-img').files[0];if(!f){toast('Choose an image');return}const v=i=>{const e=$('#f-'+k+'-'+i);return e?e.value.trim():''};
 try{const row={title:v(0),subtitle:v(1)};if(k==='news')row.reg=!!($('#f-news-reg')||{}).checked;else{row.details=v(2);row.price_text=v(3);row.buy_url=v(4);if(row.buy_url&&!/^https?:\/\//.test(row.buy_url)){toast('Buy link must start with https://');return}}
 const b=await shrink(f,900),p=k+'/'+Date.now()+'.jpg',u=await sb.storage.from('media').upload(p,b,{contentType:'image/jpeg'});if(u.error)throw u.error;row.image_url=sb.storage.from('media').getPublicUrl(p).data.publicUrl;
 const r=await sb.from(k).insert(row);if(r.error)throw r.error;toast('Uploaded');await loadAll();render()}catch(e){toast(e.message||'Upload failed')}};
async function setTeamImg(){const n=$('#tn').value.trim(),f=$('#tf').files[0];if(!n||!f){toast('Enter team name and choose a photo');return}try{const b=await shrink(f,900),p='teams/'+Date.now()+'.jpg',u=await sb.storage.from('media').upload(p,b,{contentType:'image/jpeg'});if(u.error)throw u.error;const url=sb.storage.from('media').getPublicUrl(p).data.publicUrl,r=await sb.from('lb').update({image_url:url}).eq('team',n).select();if(r.error)throw r.error;if(!r.data.length){toast('Team is not on the leaderboard yet');return}toast('Team photo saved');await loadAll();render()}catch(e){toast(e.message||'Failed')}}
const csvEsc=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
const HDR=['No','Player','Player ID','FF UID','FF name','TID'];
const sheetRows=sid=>(S.allbk||[]).filter(b=>b.scrim_id===sid).map((b,i)=>{const p=b.profiles||{},t=(S.allpay||[]).find(x=>x.user_id===b.user_id&&x.kind==='scrim'&&x.ref_id===sid&&x.status==='approved');return [i+1,p.name||'',p.player_id||'',p.ff_uid||'',p.ff_name||'',t?t.txn_id:'']});
const copyText=t=>navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy failed')):toast('Copy not supported');
const dlCsv=(rows,name)=>{const t=rows.map(r=>r.map(csvEsc).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name+'.csv';document.body.appendChild(a);a.click();a.remove()};
const copySheet=sid=>copyText([HDR,...sheetRows(sid)].map(r=>r.join('\t')).join('\n'));
const csvSheet=sid=>{const s=S.scrims.find(x=>x.id===sid)||{};dlCsv([HDR,...sheetRows(sid)],'scrim-'+String(s.t||sid).replace(/\W+/g,'')+'-'+(s.map||''))};
const REGH=['Tournament','Team','FF UID','Player','Player ID'];
const regRows=()=>(S.allreg||[]).map(r=>[(r.news||{}).title||'',r.team_name,r.ff_uid,(r.profiles||{}).name||'',(r.profiles||{}).player_id||'']);
const copyRegs=()=>copyText([REGH,...regRows()].map(r=>r.join('\t')).join('\n'));
const csvRegs=()=>dlCsv([REGH,...regRows()],'registrations');
async function sendIDP(sid){const rid=$('#rm'+sid).value.trim(),rp=$('#rp'+sid).value.trim();if(!rid||!rp){toast('Enter room ID and password');return}const r=await sb.rpc('release_room',{sid,rid,rpass:rp});toast(r.error?r.error.message:'Sent to booked players');await loadAll();render()}
function adm2(){const all=S.allpay||[],pend=all.filter(p=>p.status==='pending'),who=p=>p.profiles?esc(p.profiles.name)+' \u00b7 '+esc(p.profiles.player_id):'';
 return `<h3>Pending payments (${pend.length})</h3>`+(pend.map(p=>`<div class="g card"><div class="row"><b class="sp" style="font-size:13px">${who(p)}</b><b>${rs(p.amount)}</b></div><div class="m" style="margin:4px 0 8px">${esc(p.method)} \u00b7 from ${esc(p.sender_number)} \u00b7 TID ${esc(p.txn_id)} \u00b7 ${p.kind==='plan'?'Membership':'Scrim slot'}</div><div class="row">${p.screenshot_path?`<button class="btn o" onclick="viewSS('${esc(p.screenshot_path)}')">Screenshot</button>`:''}<span class="sp"></span><button class="btn o" onclick="rej(${p.id})">Reject</button><button class="btn" onclick="apr(${p.id})">Approve</button></div></div>`).join('')||'<p class="m">No pending payments.</p>')
 +'<h3>Booking sheets &amp; room ID (IDP)</h3>'+(S.scrims.map(s=>{const rows=sheetRows(s.id),rm=S.rooms[s.id]||{};return `<div class="g card"><div class="row"><b class="sp">${esc(s.t)} \u00b7 ${esc(s.map)}</b><span class="tag">${rows.length}/${s.cap}</span></div><div class="tbl"><table><tr>${HDR.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="6">No bookings yet</td></tr>'}</table></div><div class="row" style="margin:8px 0"><button class="btn o sp" onclick="copySheet(${s.id})">Copy</button><button class="btn o sp" onclick="csvSheet(${s.id})">CSV</button></div><input id="rm${s.id}" placeholder="Room ID" aria-label="Room ID" value="${esc(rm.room_id||'')}"><input id="rp${s.id}" placeholder="Room password" aria-label="Room password" value="${esc(rm.room_pass||'')}"><button class="btn w" onclick="sendIDP(${s.id})">${rm.released?'Update &amp; resend':'Send'} IDP to ${rows.length} players</button></div>`}).join('')||'<p class="m">No scrims.</p>')
 +`<h3>Tournament registrations (${(S.allreg||[]).length})</h3><div class="g card"><div class="tbl"><table><tr>${REGH.map(h=>`<th>${h}</th>`).join('')}</tr>${regRows().map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="5">No registrations yet</td></tr>'}</table></div><div class="row" style="margin-top:8px"><button class="btn o sp" onclick="copyRegs()">Copy</button><button class="btn o sp" onclick="csvRegs()">CSV</button></div></div>`
 +`<h3>Team photo (leaderboard)</h3><div class="g card"><input id="tn" placeholder="Team name (as on leaderboard)" aria-label="Team name"><input type="file" id="tf" accept="image/*"><button class="btn w" onclick="setTeamImg()">Save team photo</button></div>`
 +`<h3>Update player stats</h3><div class="g card"><input id="ps3" placeholder="Player ID (FF-123456)" aria-label="Player ID"><input id="ps0" inputmode="numeric" placeholder="Matches played (+)"><input id="ps1" inputmode="numeric" placeholder="Matches won (+)"><input id="ps2" inputmode="numeric" placeholder="Scrim kills (+)"><button class="btn w" onclick="addPS()">Add stats</button></div>`
 +(role==='super'?`<h3>All payments</h3>`+all.filter(p=>p.status!=='pending').slice(0,30).map(p=>`<div class="g card row"><div class="sp"><b style="font-size:13px">${who(p)}</b><div class="m">${esc(p.method)} \u00b7 TID ${esc(p.txn_id)}</div></div><div style="text-align:right"><b>${rs(p.amount)}</b><br><span class="tag ${p.status==='rejected'?'f':''}">${esc(p.status)}</span></div></div>`).join(''):'')
 +`<button class="btn k w" style="margin:14px 0 6px" onclick="mode='user';render()">Back to user app</button>`}

theme();boot();

</script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
