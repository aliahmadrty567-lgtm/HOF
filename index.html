const dt=d=>new Date(d).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});
const shrink=(f,mx)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(mx,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('Image error')),'image/jpeg',.8)};im.onerror=()=>no(new Error('Image error'));im.src=r.result};r.readAsDataURL(f)});


async function boot(){try{await boot2()}catch(e){ready=true;document.getElementById('app').innerHTML='<div class="g card" style="margin-top:20px"><b>Connection error</b><p class="m" style="margin-top:6px">'+String(e.message).replace(/</g,'&lt;')+'</p><p class="m" style="margin-top:6px">Send a screenshot of this message to Claude.</p></div>'}}

/* auth screen */
V.auth=()=>`<div class="g card" style="margin-top:40px;text-align:center;padding:26px 18px"><img src="icon-192.png" alt="HOF" style="width:88px;height:88px;border-radius:22px;margin-bottom:6px"><p class="m" style="margin:2px 0 16px">House of Champions</p>${am==='up'?'<input id="an" placeholder="Player name" aria-label="Player name">':''}<input id="ae" type="email" placeholder="Email" aria-label="Email" autocomplete="email"><input id="ap" type="password" placeholder="Password (6+ characters)" aria-label="Password" autocomplete="${am==='up'?'new-password':'current-password'}"><button class="btn w" onclick="doAuth()">${am==='up'?'Create account':'Log in'}</button><button class="btn o w" style="margin-top:8px" onclick="am=am==='up'?'in':'up';render()">${am==='up'?'I already have an account':'New here? Sign up'}</button></div>`;
async function doAuth(){const e=$('#ae').value.trim(),p=$('#ap').value;if(!e||p.length<6){toast('Enter email and a 6+ character password');return}let r;if(am==='up')r=await sb.auth.signUp({email:e,password:p,options:{data:{name:($('#an').value||'Player').trim()}}});else r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error){toast(r.error.message);return}if(!r.data.session){toast('Check your email to confirm, then log in');return}await boot()}
V.login=()=>{sb.auth.signOut();uid=null;role=null;view='home';mode='user';setTimeout(render,0);return ''};

/* payment (manual approval) */
const hist=()=>S.hist.length?`<h3>Recent payments</h3>`+S.hist.slice(0,5).map(h=>`<div class="g card row"><div class="sp"><b style="font-size:13px">${esc(h.l0)}</b><div class="m">${esc(h.date)} \u00b7 ${esc(h.m)}</div></div><div style="text-align:right"><b>${rs(h.amt)}</b><br><span class="tag ${h.st==='rejected'?'f':''}">${esc(h.st)}</span></div></div>`).join(''):'';
V.pay=function(){
 if(rc&&rc.pending)return `<h2>Payment submitted</h2><div class="g card" style="text-align:center;padding:26px 16px"><div style="font-size:34px">\u23f3</div><b>${esc(rc.label)}</b><p class="m" style="margin-top:6px">Waiting for admin approval. Your slot or membership activates once it is approved.</p></div><button class="btn w" onclick="rc=null;go('home')">Done</button>`+hist();
 if(!order)return `<h2>Payment</h2><div class="g card" style="text-align:center;padding:26px 16px"><div style="font-size:34px">\ud83d\udcb3</div><p class="m" style="margin-top:8px">Nothing to pay right now. Book a scrim or pick a membership and you\u2019ll land here.</p></div>`+hist();
 if(!PAY_TO[pay.m])pay.m='JazzCash';
 return `<h2>Payment</h2><div class="g card row"><div class="sp"><b>${esc(order.label)}</b><div class="m">Total to pay</div></div><b style="font-size:20px">${rs(order.amt)}</b></div><b style="font-size:14px;margin:0 2px">Pay with</b><div class="chips" style="margin-top:8px">${Object.keys(PAY_TO).map(x=>`<button class="chip ${pay.m===x?'on':''}" onclick="pay.m='${x}';render()">${x}</button>`).join('')}</div><div class="g card"><div class="m">Send exactly ${rs(order.amt)} to</div><b style="font-size:20px">${esc(PAY_TO[pay.m])}</b><div class="m">${esc(HOF_NAME)} \u00b7 ${pay.m}</div></div><input inputmode="numeric" maxlength="11" placeholder="Your sender number (03XXXXXXXXX)" aria-label="Sender number" value="${esc(pay.num||'')}" oninput="pay.num=this.value"><input placeholder="Transaction ID (TID)" aria-label="Transaction ID" value="${esc(pay.tx||'')}" oninput="pay.tx=this.value"><label class="m" style="display:block;margin:0 2px 6px">Payment screenshot (optional)</label><input id="sf" type="file" accept="image/*"><button class="btn w" onclick="submitPay()">Submit for approval</button>`+hist()};
async function submitPay(){
 const num=(pay.num||'').trim(),tx=(pay.tx||'').trim(),f=$('#sf').files[0];
 if(!/^03\d{9}$/.test(num)){toast('Enter your 11-digit number starting with 03');return}
 if(tx.length<6){toast('Enter the transaction ID');return}
 try{let path=null;if(f){const b=await shrink(f,1000);path=uid+'/'+Date.now()+'.jpg';const u=await sb.storage.from('receipts').upload(path,b,{contentType:'image/jpeg'});if(u.error)throw u.error}
 const r=await sb.from('payments').insert({user_id:uid,kind:order.kind,ref_id:order.id,amount:order.amt,method:pay.m,sender_number:num,txn_id:tx,screenshot_path:path});if(r.error)throw r.error;
 rc={pending:1,label:order.label};order=null;pay.num='';pay.tx='';await loadAll();render()}catch(e){toast(e.message||'Could not submit')}}

addR=async function(){const n=$('#rt').value.trim(),p=parseInt($('#rp').value),k=parseInt($('#rk').value)||0;if(!n||!p){toast('Enter team and placement');return}const r=await sb.rpc('add_result',{team_name:n,place:p,kills:k});toast(r.error?r.error.message:'Leaderboard updated');await loadAll();render()};
addPS=async function(){const g=i=>Number($('#ps'+i).value)||0,pid=$('#ps3').value.trim();const u=await sb.from('profiles').select('id').eq('player_id',pid).single();if(u.error){toast('Player ID not found');return}const r=await sb.rpc('add_player_stats',{uid:u.data.id,m:g(0),w:g(1),k:g(2)});toast(r.error?r.error.message:'Player stats updated');await loadAll();render()};

 sw.style.visibility=role?'visible':'hidden';if(!role)mode='user';

async function loadAll(){
 const since=new Date(Date.now()-864e5).toISOString();
 const q=await Promise.all([
  sb.from('profiles').select('*').eq('id',uid).single(),
  sb.from('scrims').select('*').eq('active',true).order('id'),
  sb.from('scrim_slots').select('*'),
  sb.from('plans').select('*').order('id'),
  sb.from('news').select('*').order('id',{ascending:false}),
  sb.from('banners').select('*').order('id',{ascending:false}).limit(5),
  sb.from('lb').select('*').order('points',{ascending:false}),
  sb.from('payments').select('*').eq('user_id',uid).order('id',{ascending:false}).limit(30),
  sb.from('bookings').select('*,scrims(time_label,map)').eq('user_id',uid).order('id',{ascending:false}),
  sb.rpc('my_peers'),
  sb.from('messages').select('*').or('sender.eq.'+uid+',receiver.eq.'+uid).order('created_at').limit(500),
  sb.from('groups').select('*'),
  sb.from('group_messages').select('*').order('created_at').limit(500),
  sb.from('stories').select('*').gt('created_at',since).order('created_at'),
  sb.from('notifications').select('*').order('id',{ascending:false}).limit(30),
  sb.from('registrations').select('news_id').eq('user_id',uid),
  sb.rpc('ads_today'),
  sb.from('scrim_rooms').select('*')]);
 const [P,SC,SL,PL,NW,BN,LB,PY,BK,PE,MS,GR,GM,ST,NT,RG,AC,RM]=q;
 if(P.error||!P.data){toast('Could not load your profile');return false}
 const p=P.data,tk=SL.data||[];
 role=p.role==='user'?null:p.role;vSync=p.visible;
 S.me={uid,name:p.name,id:p.player_id,bio:p.bio,m:p.matches,w:p.wins,k:p.kills,vis:p.visible,av:p.avatar_url,ffu:p.ff_uid,ffn:p.ff_name};
 S.coins=p.coins;S.member=p.member;S.ads=AC.data||0;
 S.scrims=(SC.data||[]).map(s=>({id:s.id,t:s.time_label,map:s.map,fee:s.fee,cap:s.cap,got:((tk.find(x=>x.scrim_id===s.id)||{}).taken)||0}));
 S.plans=(PL.data||[]).map(x=>({id:x.id,n:x.name,p:x.price,d:x.description}));
 S.tasks=[];
 const im=x=>({id:x.id,t:x.title,s:x.subtitle,img:x.image_url});
 S.news=(NW.data||[]).map(x=>({...im(x),reg:x.reg}));
 S.banners=(BN.data||[]).map(x=>({...im(x),d:x.details,pr:x.price_text,url:x.buy_url}));
 S.lb=(LB.data||[]).map(x=>({n:x.team,p:x.points,img:x.image_url}));
 S.mine=(BK.data||[]).map(b=>({sid:b.scrim_id,label:b.scrims?b.scrims.time_label+' \u00b7 '+b.scrims.map:'Scrim',date:dt(b.created_at)}));
 S.hist=(PY.data||[]).map(y=>{const pl=S.plans.find(x=>x.id===y.ref_id),sc=S.scrims.find(x=>x.id===y.ref_id);const l=y.kind==='plan'?(pl?pl.n+' membership':'Membership'):(sc?'Scrim '+sc.t+' '+sc.map:'Scrim slot');return{l0:l,label:l+' ('+y.status+')',st:y.status,amt:y.amount,m:y.method,date:dt(y.created_at)}});
 S.people=(PE.data||[]).map(x=>({id:x.player_id,uid:x.id,n:x.name,av:x.avatar_url,bio:x.bio,st:x.matches==null?null:[x.matches,x.wins,x.kills]}));
 S.groups=(GR.data||[]).map(g=>({g:1,id:g.id,n:g.name}));
 S.msgs={};(MS.data||[]).forEach(m=>{const o=m.sender===uid?m.receiver:m.sender,pe=S.people.find(x=>x.uid===o);if(!pe)return;(S.msgs[pe.id]=S.msgs[pe.id]||[]).push({me:m.sender===uid?1:0,t:m.body,h:tm(m.created_at),i:+new Date(m.created_at)})});
 S.gmsgs={};(GM.data||[]).forEach(m=>{(S.gmsgs[m.group_id]=S.gmsgs[m.group_id]||[]).push({me:m.sender===uid?1:0,t:m.body,h:tm(m.created_at),i:+new Date(m.created_at),from:nameOf(m.sender)})});
 S.stories=ST.data||[];S.notifs=NT.data||[];S.regs=(RG.data||[]).map(r=>r.news_id);
 S.rooms={};(RM.data||[]).forEach(r=>S.rooms[r.scrim_id]=r);
 if(role){
  const a=await Promise.all([
   sb.from('payments').select('*,profiles(name,player_id)').order('id',{ascending:false}).limit(100),
   sb.from('bookings').select('*,profiles(name,player_id,ff_uid,ff_name)').order('id'),
   sb.from('registrations').select('*,news(title),profiles(name,player_id)').order('id')]);
  S.allpay=a[0].data||[];S.allbk=a[1].data||[];S.allreg=a[2].data||[]}
 return true}

/* realtime + alerts */
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.05;o.start();setTimeout(()=>{o.stop();c.close()},120)}catch(e){}}
function alertMsg(t,b){toast('\ud83d\udd14 '+t+': '+String(b).slice(0,40));try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}beep();if(document.hidden&&window.Notification&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:String(b).slice(0,80),icon:'icon-192.png',tag:'hof'})).catch(()=>{})}
function askNotif(){if(window.Notification)Notification.requestPermission().then(()=>render());else toast('Alerts are not supported on this browser')}
function incoming(pe,body,at,from,push){const k=keyOf(pe);if(push!==false)(pe.g?(S.gmsgs[pe.id]=S.gmsgs[pe.id]||[]):(S.msgs[pe.id]=S.msgs[pe.id]||[])).push({me:0,t:body,h:tm(at),i:Date.now(),from});const open=view==='chat'&&chat&&keyOf(chat)===k&&!document.hidden;if(open)setRd(k);else alertMsg(pe.g?pe.n+' \u00b7 '+from:pe.n,body);render()}
async function onDM(e){const m=e.new;let pe=S.people.find(x=>x.uid===m.sender);if(pe)return incoming(pe,m.body,m.created_at);await loadAll();pe=S.people.find(x=>x.uid===m.sender);if(pe)incoming(pe,m.body,m.created_at,null,false);else{alertMsg('New message',m.body);render()}}
async function onGM(e){const m=e.new;if(m.sender===uid)return;let g=S.groups.find(x=>x.id===m.group_id);if(!g){await loadAll();g=S.groups.find(x=>x.id===m.group_id);if(g)incoming(g,m.body,m.created_at,nameOf(m.sender),false);return}incoming(g,m.body,m.created_at,nameOf(m.sender))}
async function onNT(e){await loadAll();alertMsg(e.new.title,e.new.body);render()}
async function boot2(){
 const r=await sb.auth.getSession(),s=r.data&&r.data.session;
 ready=true;

 uid=s.user.id;await loadAll();
 if(!chan){chan=sb.channel('hof-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'receiver=eq.'+uid},onDM).on('postgres_changes',{event:'INSERT',schema:'public',table:'group_messages'},onGM).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+uid},onNT).subscribe()}
 render()}

 RM2=r.data.map(x=>({sr:1,sid:x.scrim_id,id:'sr'+x.scrim_id,n:'Scrim '+x.label+' \u00b7 '+x.map,rid:x.room_id,rp:x.room_pass,end:+new Date(x.ends_at),mem:x.members}));
 const changed=old!==sig(RM2);
 Object.keys(S.msgs).forEach(k=>{if(/^sr\d+$/.test(k)&&!RM2.some(x=>x.id===k))delete S.msgs[k]});
 if(RM2.length&&(force||changed)){
  const c=await sb.from('scrim_chat').select('*').in('scrim_id',RM2.map(x=>x.sid)).order('created_at').limit(400);
  RM2.forEach(x=>{S.msgs[x.id]=[]});

 return changed}

const HXA={v:null,coins:null,ck:null,bn:0};

function hxEnter(){

function hxCount(root){
 root.querySelectorAll('.bn,.mv,.st b,b[style*="26px"],b[style*="24px"]').forEach(el=>{
  const tn=[...el.childNodes].find(n=>n.nodeType===3&&/^\s*\d{1,7}\s*$/.test(n.nodeValue));
  if(!tn)return;const n=+tn.nodeValue.trim();if(n<2)return;
  const d=Math.min(1100,450+n*4),s=performance.now();tn.nodeValue='0';
  const step=now=>{const p=Math.min(1,(now-s)/d),e=1-Math.pow(1-p,3);tn.nodeValue=String(p<1?Math.round(n*e):n);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step)})}

 document.body.appendChild(e);setTimeout(()=>e.remove(),1400);

 st.push(cur);
